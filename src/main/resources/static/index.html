<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvidenceLab</title>
  <link rel="stylesheet" href="/styles.css?v=20260918-workspace">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="rail">
      <div class="brand">
        <div class="mark">EL</div>
        <div>
          <p class="eyebrow">Research Workbench</p>
          <h1>EvidenceLab</h1>
        </div>
      </div>
      <p id="serviceState" class="status-pill">连接中</p>
      <p id="modelState" class="status-pill">模型：读取中</p>

      <form id="loginForm" class="panel">
        <h2>登录</h2>
        <p id="loginState" class="muted">student / student123</p>
        <label class="field"><span>账号</span><input id="username" value="student" autocomplete="username"></label>
        <label class="field"><span>密码</span><input id="password" type="password" value="student123" autocomplete="current-password"></label>
        <button type="submit" class="primary">进入工作区</button>
      </form>

      <section id="accountPanel" class="panel" hidden>
        <p class="eyebrow">当前账号</p>
        <h2 id="activeAccount">已登录</h2>
        <p id="activeRole" class="muted"></p>
        <button id="switchAccount" type="button" class="ghost">切换账号</button>
      </section>

      <nav id="projectNav" class="nav" hidden>
        <button type="button" data-view="overview" class="nav-item active">项目概览</button>
        <button type="button" data-view="decisions" class="nav-item">决策账本</button>
        <button type="button" data-view="experiments" class="nav-item">实验记录</button>
        <button type="button" data-view="sources" class="nav-item">证据库</button>
        <button type="button" data-view="tasks" class="nav-item">Agent 轨迹</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">当前项目</p>
          <h2 id="projectTitle">未选择项目</h2>
          <p id="projectObjective" class="muted">登录后创建或选择研究项目。</p>
        </div>
        <div class="topbar-actions">
          <button id="openAssistant" type="button" class="ghost" hidden>研究助手</button>
          <button id="refreshWorkspace" type="button" class="ghost" hidden>刷新</button>
        </div>
      </header>

      <section id="projectPicker" class="panel">
        <div class="panel-head">
          <h3>项目列表</h3>
          <button id="createProjectBtn" type="button" class="primary">新建项目</button>
        </div>
        <div id="projectList" class="stack"></div>
        <form id="createProjectForm" class="stack" hidden>
          <label class="field"><span>名称</span><input id="projectName" required maxlength="120"></label>
          <label class="field"><span>研究目标</span><textarea id="projectObjectiveInput" required maxlength="4000"></textarea></label>
          <label class="field"><span>约束（可选）</span><textarea id="projectConstraints" maxlength="4000"></textarea></label>
          <div class="row">
            <button type="submit" class="primary">创建</button>
            <button id="cancelCreateProject" type="button" class="ghost">取消</button>
          </div>
        </form>
      </section>

      <section id="workspaceRoot" hidden>
        <p id="workspaceBanner" class="banner" hidden></p>

        <section id="view-overview" class="view">
          <article id="activeDecisionCard" class="decision-card empty">
            <p class="eyebrow">ACTIVE DECISION</p>
            <h3>暂无已确认决策</h3>
            <p class="muted">发起正式决策任务后，确认的推荐会出现在这里。</p>
          </article>
          <div class="grid-2">
            <article class="panel">
              <h3>下一步最小实验</h3>
              <p id="nextExperiment" class="muted">确认决策后显示。</p>
            </article>
            <article class="panel">
              <h3>证据缺口</h3>
              <ul id="evidenceGaps" class="bullets"><li class="muted">无</li></ul>
            </article>
          </div>
        </section>

        <section id="view-decisions" class="view" hidden>
          <div class="panel-head">
            <h3>决策账本</h3>
            <button id="startDecisionTask" type="button" class="primary">发起决策任务</button>
          </div>
          <div id="decisionList" class="stack"></div>
        </section>

        <section id="view-experiments" class="view" hidden>
          <div class="panel-head">
            <h3>实验记录</h3>
            <button id="createExperimentBtn" type="button" class="primary">新建实验</button>
          </div>
          <div id="experimentList" class="stack"></div>
        </section>

        <section id="view-sources" class="view" hidden>
          <div class="panel-head">
            <h3>证据库</h3>
            <label class="upload">
              <span>上传 PDF / MD / TXT</span>
              <input id="sourceFile" type="file" accept=".pdf,.md,.txt,text/plain,application/pdf">
            </label>
          </div>
          <div id="sourceList" class="stack"></div>
        </section>

        <section id="view-tasks" class="view" hidden>
          <div class="panel-head">
            <h3>Agent 轨迹 / 任务</h3>
            <button id="retryFailedTask" type="button" class="ghost">重试最近失败任务</button>
          </div>
          <div id="taskList" class="stack"></div>
        </section>
      </section>
    </main>

    <aside id="assistantDrawer" class="drawer" hidden>
      <div class="drawer-head">
        <h3>研究助手</h3>
        <button id="closeAssistant" type="button" class="ghost">关闭</button>
      </div>
      <p class="muted">普通问答不会自动创建决策。正式决策请用「发起决策任务」。</p>
      <div id="assistantMessages" class="chat-log"></div>
      <form id="assistantForm" class="assistant-form">
        <textarea id="assistantInput" rows="3" placeholder="解释概念、询问资料，或描述约束…"></textarea>
        <div class="row">
          <button type="submit" class="primary">普通回答</button>
          <button id="assistantDecisionBtn" type="button" class="ghost">转为决策任务</button>
        </div>
      </form>
    </aside>
  </div>
  <script src="/app.js?v=20260918-workspace"></script>
</body>
</html>
